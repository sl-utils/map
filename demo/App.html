<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#app { width: 100%; height: 100%; }
.card {
  position: absolute;
  z-index: 100;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  overflow: hidden;
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module">
import * as mapLib from "../build/index.js";
window.__map_lib__ = mapLib;

const { createApp, defineComponent } = Vue;

const App = defineComponent({
setup() {
const { SLUMap, MapPluginDraw } = window.__map_lib__;
const { ref, onMounted } = Vue;

onMounted(() => {
  const map4 = new SLUMap("map");
  map4.init({ type: "A" }).then(()=>{
 const draw = new MapPluginDraw(map4.map);
    draw.addRect({
      latlngs: [
        [26.3, 110.5],
        [27.3, 112.5],
      ],
      width: 500,
      height: 50,
    });
    draw.addArc({
      latlng: [22.5, 114.0],
      size: 100,
    });
  })
  // const map1 = new MapCanvasDraw()
  // const map2 = new MapCanvasEvent()
  // const map3 = new MapCanvasLayer()
  // SLUCanvasText.drawText({},{})
});
return {  };
},
  template: `<div id="map" class="card"></div>`
});

createApp(App).mount('#app');
  </script>
</body>
</html>
