<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>plugin-wind</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#app { width: 100%; height: 100%; }
.card {
  position: absolute;
  z-index: 100;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  overflow: hidden;
}
.btn {
  width: 84px;
  height: 32px;
  position: absolute;
  z-index: 100;
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module">
import * as mapLib from "../build/index.js";
window.__map_lib__ = mapLib;

const { createApp, defineComponent } = Vue;

const App = defineComponent({
setup() {
/**风场 */
const { onMounted, ref } = Vue;
// 使用 fetch 动态加载大文件
const windjson = fetch("./assets/json/wind-global.json")
  .then(res => res.json());
const { MapPluginWind, SLUMap } = window.__map_lib__;
const iconUrl = "./assets/icons/icon-28.png";
let wind_;
let map;
/**是否显示风场数据 */
const ifShow = ref(false);
const iconResolver: (speed) => Image = (speed) => {
  const level =
 {
  map = new SLUMap("map");
  await map.init({ type: "L" });
});
function onVisible() {
  ifShow.value = !ifShow.value;
  ifShow.value ? add() : remove();
}
async function add() {
  wind_ = new MapPluginWind(map, options);
  wind_.setIconResolver(iconResolver);
  wind_.setData(await windjson);
}
function remove() {
  if (!wind_) return;
  wind_?.onRemove();
  wind_ = undefined;
}
return { windjson, iconUrl, wind_, map, ifShow, iconResolver };
},
  template: `<div id="map" class="card"></div>
  <button class="btn" @click="onVisible">
    {{ ifShow ? "隐藏" : "显示" }}风场
  </button>`
});

createApp(App).mount('#app');
  </script>
</body>
</html>
