<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>plugin-range</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#app { width: 100%; height: 100%; }
.card {
  position: absolute;
  z-index: 100;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  overflow: hidden;
}
.btn {
  width: 84px;
  height: 32px;
  position: absolute;
  z-index: 100;
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module">
import * as mapLib from "../build/index.js";
window.__map_lib__ = mapLib;

const { createApp, defineComponent } = Vue;

const App = defineComponent({
setup() {
/**测距 */
const { SLUMap, MapPluginRange } = window.__map_lib__;
const { onMounted } = Vue;
let range_;
onMounted(async () => {
  const map = new SLUMap("map");
  await map.init({ type: "L" });
  range_ = new MapPluginRange(map);
});
function onRange() {
  range_.open();
}
return { range_, onRange };
},
  template: `<div id="map" class="card"></div>
  <button class="btn" @click="onRange">测距</button>`
});

createApp(App).mount('#app');
  </script>
</body>
</html>
