<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>plugin-partial</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#app { width: 100%; height: 100%; }
.card {
  position: absolute;
  z-index: 100;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  overflow: hidden;
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module">
import * as mapLib from "../build/index.js";
window.__map_lib__ = mapLib;

const { createApp, defineComponent } = Vue;

const App = defineComponent({
setup() {
const { SLUMap, MapPluginPartial } = window.__map_lib__;
const { onMounted } = Vue;
/**leaflet的粒子效果 */
onMounted(async () => {
  const map = new SLUMap("map");
  await map.init({ type: "L" });
  map.setFitView([
    [39.735008, 117.58103],
    [39.74, 117.525],
  ]);
  const partial = new MapPluginPartial(map);
  partial.setAllParticles([
    {
      latlngs: [
        [39.745, 117.555],
        [39.74, 117.555],
        [39.74, 117.565],
      ],
      colorParticle: "red",
      dense: 10,
    },
  ]);
});
return {  };
},
  template: `<div id="map" class="card"></div>`
});

createApp(App).mount('#app');
  </script>
</body>
</html>
