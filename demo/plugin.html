<!DOCTYPE html>

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#app { width: 100%; height: 100%; }
.card {
  position: absolute;
  z-index: 100;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  overflow: hidden;
}

.btns {
  display: flex;

  z-index: 100;
}

.btn {

  display: flex;
  flex-direction: column;
}
.lat-lng {

  align-items: center;
}
.lat {
  margin-left: 5px;
  margin-right: 10px;
}
.lng {
  padding-right: 10px;
}
.zoom-count {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  margin-bottom: 5px;
  padding: 3px;
  border-radius: 3px;
}
.scale {
  border: 1px solid #333;
  border-top-width: 0px;
  height: 10px;
  line-height: 0px;
  text-align: center;
  margin-right: 50px;
  margin-left: 25px;
  background-color: rgba(255, 255, 255, 0.3);
}
.tran {
  height: 24px;
  width: 26px;
  display: flex;
  align-items: center;

  border-left: 1px solid #e2e9f8;

}

const App = defineComponent({

/**点击开启/关闭控件按钮 */

}
/**开启控件 */
function openCtr() {
  const info = map.openControl();
  const { lat, lng, zoom, scale, width } = info;
  Object.assign(data, { lat, lng, zoom, scale, width });
  /**持续更新控件数据 */
  map.onControlUpdate((info) => {
    const { lat, lng, zoom, scale, width } = info;
    Object.assign(data, { lat, lng, zoom, scale, width });
  });
}
/**切换经纬度模式 */
function onClickTran() {
  ifDMS.value = !ifDMS.value;

  const { lat, lng, zoom, scale, width } = info;
  Object.assign(data, { lat, lng, zoom, scale, width });
}

  let { posX, posY } = getShipImgPosBytypeCode(code);

  return {
    info: e,
    url: "./assets/icons/icon-16.png",
    latlng: [lat, lng],
    size: [16, 16],
    sizeo: [16, 16],
    rotate: cog,
    posX,
    posY,
    type: ["click", "dblclick"],
  };
}
