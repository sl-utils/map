<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>plugin-radar</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }
#app { width: 100%; height: 100%; }
.card {
  position: absolute;
  z-index: 100;
  width: 100%;
  height: 100%;
  left: 0px;
  top: 0px;
  overflow: hidden;
}
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script type="module">
import * as mapLib from "../build/index.js";
window.__map_lib__ = mapLib;

const { createApp, defineComponent } = Vue;

const App = defineComponent({
setup() {
const { SLUMap, MapPluginRadar } = window.__map_lib__;
const { onMounted } = Vue;
/**雷达 */
onMounted(async () => {
  const map = new SLUMap("map");
  await map.init({ type: "L" });
  const radar = new MapPluginRadar(map);
  let radarData = [
      { id: "1", name: "厂区雷达", radius: 500, latitude: 39.749, longitude: 117.555, angle: [115, 205], ifClockwise: false },
      { id: "2", name: "海口雷达", radius: 50000, latitude: 20.47719, sectorAngle: 60, longitude: 109.45816, angle: [0, 90] },
    ];
    map.setCenter([39.749, 117.555], 15);
    let radars = radarData.map((e) => transformRadarInfo(e));
    radar.setAllRadars(radars);
});
/**转换为雷达数据配置 */
  function transformRadarInfo(radar){
    let { latitude, longitude, radius, angle, ifClockwise, id } = radar;
    return {
      latlng: [latitude, longitude],
      sizeFix: [radius, radius],
      time: 3,
      ifClockwise,
      angle,
      minZoom: 5,
      animeId: id,
      sectorAngle: 60,
      arcDash: [100, 500, 1500, 2000, 4000],
      colorDash: ["#FF0000", "#ffff00"],
      colorRadar: "#00FFFF",
      info: radar,
      type: "click",
    };
  }
return { transformRadarInfo };
},
  template: `<div id="map" class="card"></div>`
});

createApp(App).mount('#app');
  </script>
</body>
</html>
